<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ライド予約</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f6f6f6; color: #111; }
    .navbar-brand { letter-spacing: .08em; }
    .ride-card { border: 0; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
    .map-card { overflow: hidden; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
    .map-frame { border: 0; width: 100%; height: 620px; display: block; }
    .location-dot { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; }
    .pickup-dot { background: #111; }
    .dropoff-dot { background: #2f7dff; }
    .route-line { border-left: 2px dashed #c8c8c8; height: 24px; margin: 4px 0 4px 5px; }
    .metric { background: #f1f3f5; border-radius: 14px; padding: 14px; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark py-3">
    <div class="container"><span class="navbar-brand mb-0 h1">RIDE</span><span class="text-white-50">ルートを確認してください</span></div>
  </nav>
  <main class="container py-4 py-lg-5">
    <div class="row g-4 align-items-stretch">
      <div class="col-lg-4">
        <section class="card ride-card h-100">
          <div class="card-body p-4">
            <span class="badge text-bg-success mb-3">ドライバーを選択済み</span>
            <h1 class="h3 fw-bold mb-4">ライド情報</h1>
            <div class="d-flex align-items-start gap-3">
              <span class="location-dot pickup-dot mt-1"></span>
              <div><small class="text-secondary">乗車地</small><p class="mb-0 fw-medium">福岡市博多区博多駅前４丁目２１−１１ AIWA BLD</p></div>
            </div>
            <div class="route-line"></div>
            <div class="d-flex align-items-start gap-3 mb-4">
              <span class="location-dot dropoff-dot mt-1"></span>
              <div><small class="text-secondary">目的地</small><p class="mb-0 fw-medium">福岡市筥松２丁目３２</p></div>
            </div>
            <div class="row g-2 mb-4">
              <div class="col-6"><div class="metric"><small class="text-secondary d-block">距離</small><strong>4.43 km</strong></div></div>
              <div class="col-6"><div class="metric"><small class="text-secondary d-block">所要時間</small><strong>17 分</strong></div></div>
              <div class="col-6"><div class="metric"><small class="text-secondary d-block">ライド状況</small><strong id="ride-status">N/A</strong></div></div>
              <div class="col-6"><div class="metric"><small class="text-secondary d-block">支払い方法</small><strong id="payment-method">N/A</strong></div></div>
            </div>
            <a class="btn btn-dark w-100 py-3 fw-semibold" href="https://www.google.com/maps/dir/?api=1&origin=33.584790999999996,130.4180577&destination=33.6182583,130.4269653&travelmode=driving" target="_blank">Google マップで開く</a>
          </div>
        </section>
      </div>
      <div class="col-lg-8">
        <section class="map-card h-100">
          <iframe class="map-frame" title="ライドルート" src="https://www.google.com/maps/embed/v1/directions?key=AIzaSyDdXO2m45jvKrWvFIz4SH3LtZ_XNhU4rG0&origin=33.584790999999996,130.4180577&destination=33.6182583,130.4269653&mode=driving" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
